<section>
  <h2>Users</h2>
  <form method="POST" action="/v1/admin/user/enable-all" style="margin-bottom: 0.75em">
    <button type="submit">Enable all pending users</button>
  </form>
  <table id="users">
    <tr>
      <th>id</th>
      <th>name</th>
      <th>slug</th>
      <th>registered</th>
      <th>enabled</th>
      <th>admin</th>
      <th>superuser</th>
      <th></th>
    </tr>
    {% for user in admin.userList %}
      {% include "./user.html" %}
    {% endfor %}
  </table>
  <p>Should show projects each user has access to</p>
</section>
